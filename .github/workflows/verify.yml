# YAML 用縮排表示父子層級；同一層的字段屬於同一個對象。
# 以 `#` 開頭的是註釋，GitHub 不會執行；`${{ ... }}` 是 GitHub Actions 表達式。
# `name` 是工作流名稱，會顯示在 GitHub repository 的 Actions 頁面。
name: Verify

# `on` 定義「什麼 GitHub 事件會啟動這個工作流」。它不是普通的開關。
on:
  # `pull_request` 表示 Pull Request 建立、更新等相關事件可以觸發工作流。
  pull_request:
    branches: [master]
  # `push` 表示有 commit 被推送到 repository 時可以觸發工作流。
  push:
    branches: [master]
  # `workflow_dispatch` 開啟 Actions 頁面的「Run workflow」手動執行按鈕。
  # 冒號後沒有 inputs，表示手動執行時不需要填寫表單參數。
  workflow_dispatch:

# `permissions` 設定工作流自動取得的 GITHUB_TOKEN 權限。
permissions:
  contents: read

# `jobs` 是 GitHub runner 執行的工作集合。
jobs:
  # `verify` 是 job 的識別鍵，供工作流內部辨識這個 job；它不是顯示名稱。
  verify:
    runs-on: ubuntu-latest
    steps:
      # `-` 表示清單中的一個 step。`name` 是該步驟在 Actions 頁面顯示的名稱。
      - name: Check out source
        uses: actions/checkout@v4

      # setup-dotnet Action 負責安裝並設定 dotnet CLI 使用的 SDK。
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Scripts 程序是構建邏輯的唯一入口：它先發布並執行 NativeAOT 測試，再建立 Release 編譯輸出。
      # 命令失敗會以非零退出碼結束，因此 GitHub 不會把未通過測試的 commit 視為驗證成功。
      - name: Run CsSh scripts
        run: dotnet run --project proj/Tsinswreng.CsSh.Scripts/Tsinswreng.CsSh.Scripts.csproj --configuration Release -- Release
