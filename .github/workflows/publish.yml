# `${{ ... }}` 是 GitHub Actions 表達式。
# `name` 是工作流名稱，會顯示在 GitHub repository 的 Actions 頁面。
name: Publish NuGet package

# `on` 定義「什麼 GitHub 事件會啟動這個工作流」。
on:
  push:
    tags:
      # `-` 表示清單項目；`v*` 表示以字母 v 開頭的任意 tag，例如 v0.3.0-alpha。
      - 'v*'

# `permissions` 設定工作流自動取得的 GITHUB_TOKEN 權限。
permissions:
  contents: write
  # NuGet/login 需要此權限向 GitHub 取得 OIDC token，再交換一次性 NuGet API key。
  id-token: write

# `jobs` 是所有要執行的 job 的映射表。
jobs:
  # `release` 是 job 的識別鍵；整個「測試→打包→NuGet→GitHub Release」流程只在這裡執行一次。
  release:
    runs-on: ubuntu-latest
    # `environment` 將 job 綁定到 NuGet Trusted Publishing policy 所指定的 GitHub Environment。
    environment: nuget
    steps:
      # `fetch-depth: 0` 取消淺層 checkout，取得完整 Git 歷史與 tags。
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-dotnet Action 安裝並設定 dotnet CLI 使用的 SDK。
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 依 Trusted Publishing policy 用 GitHub OIDC token 交換一次性 NuGet API key。
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Tsinswreng

      # Scripts 先執行 NativeAOT 測試；測試失敗時不會執行打包、推送或建立 Release。
      # NUGET_API_KEY 是本次 workflow 臨時取得的一次性 key，並非 GitHub Secret。
      - name: Run CsSh release script
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project proj/Tsinswreng.CsSh.Scripts/Tsinswreng.CsSh.Scripts.csproj --configuration Release -- Release

      # upload-artifact Action 將 runner 上的檔案保存到本次 workflow run，供之後下載。
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-package-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error
